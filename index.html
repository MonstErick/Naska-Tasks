<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Naska Tasks</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header class="text-center py-4">
    <div class="container">
      <img
        src="img/logo.png"
        alt="Naska Tasks"
        class="logo-naska"
      >

    </div>
  </header>


  <!-- Contenido principal -->
  <main class="container pb-5">

    <div class="row g-4">

      <!-- ================================= -->
      <!-- COLUMNA IZQUIERDA: NUEVA TAREA -->
      <!-- ================================= -->

      <section class="col-lg-4">

        <div class="card shadow-sm formulario-card">

          <div class="card-body p-4">

            <h2 class="card-title mb-4">
              ➕ Agregar nueva tarea
            </h2>

            <form id="formulario-tarea">

              <div class="mb-3">

                <label for="titulo" class="form-label">
                  Título
                </label>

                <input
                  type="text"
                  class="form-control"
                  id="titulo"
                  placeholder="Ejemplo: Terminar ABP4"
                  required
                >

              </div>


              <div class="mb-3">

                <label for="descripcion" class="form-label">
                  Descripción
                </label>

                <textarea
                  class="form-control"
                  id="descripcion"
                  rows="5"
                  placeholder="Describe la tarea"
                  required
                ></textarea>

              </div>


              <div class="mb-4">

                <label for="fecha-limite" class="form-label">
                  Fecha límite
                </label>

                <input
                  type="date"
                  class="form-control"
                  id="fecha-limite"
                  required
                >

              </div>


              <button
                type="submit"
                class="btn btn-primary w-100"
              >
                Agregar tarea
              </button>

            </form>

          </div>

        </div>

      </section>


      <!-- ================================ -->
      <!-- COLUMNA DERECHA: LISTA DE TAREAS -->
      <!-- ================================ -->

      <section class="col-lg-8">

        <h2 class="mb-4">
          📋 Mis tareas
        </h2>

        <div id="lista-tareas">

          <p
            id="mensaje-sin-tareas"
            class="text-center text-muted"
          >
            Todavía no hay tareas registradas.
          </p>

        </div>

      </section>

    </div>

  </main>


  <!-- Bootstrap JavaScript -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
  </script>

  <!-- Nuestro JavaScript -->
  <script src="js/app.js"></script>

</body>
</html>
